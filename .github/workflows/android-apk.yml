name: Build E.V. APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure Gemini properties
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          cat > local.properties <<EOF
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
          EOF

      - name: Configure release signing
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/ev-release.jks"
          STOREPASS="$(openssl rand -hex 24)"
          ALIAS="evrelease"
          rm -f "$KEYSTORE"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$STOREPASS" \
            -keypass "$STOREPASS" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=E.V., OU=E.V., O=Kyro, L=India, C=IN" \
            -noprompt
          echo "EV_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "EV_KEYSTORE_PASSWORD=$STOREPASS" >> "$GITHUB_ENV"
          echo "EV_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "EV_KEY_PASSWORD=$STOREPASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/kyro-V20.apk

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/kyro-V20.apk"
          test -s "$APK"
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kyro-V20
          path: app/build/outputs/apk/release/kyro-V20.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
