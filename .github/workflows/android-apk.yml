name: Build E.V. APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic
      - name: Configure Gemini properties
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          cat > local.properties <<EOF
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
          EOF
      - name: Configure release signing
        env:
          EV_KEYSTORE_BASE64: ${{ secrets.EV_KEYSTORE_BASE64 }}
          EV_KEYSTORE_PASSWORD: ${{ secrets.EV_KEYSTORE_PASSWORD }}
          EV_KEY_ALIAS: ${{ secrets.EV_KEY_ALIAS }}
          EV_KEY_PASSWORD: ${{ secrets.EV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$EV_KEYSTORE_BASE64" ] && [ -n "$EV_KEYSTORE_PASSWORD" ] && [ -n "$EV_KEY_ALIAS" ] && [ -n "$EV_KEY_PASSWORD" ]; then
            printf '%s' "$EV_KEYSTORE_BASE64" | base64 --decode > ev-release.jks
            test -s ev-release.jks
            echo "Using repository release signing key."
          else
            echo "Release signing secrets are not configured; generating a one-build signing key."
            export EV_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            export EV_KEY_PASSWORD="$(openssl rand -hex 24)"
            export EV_KEY_ALIAS="evrelease"
            keytool -genkeypair -v               -keystore ev-release.jks               -storepass "$EV_KEYSTORE_PASSWORD"               -keypass "$EV_KEY_PASSWORD"               -alias "$EV_KEY_ALIAS"               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=E.V., OU=E.V., O=Kyro, L=India, C=IN"
          fi
          {
            echo "EV_KEYSTORE_PATH=$GITHUB_WORKSPACE/ev-release.jks"
            echo "EV_KEYSTORE_PASSWORD=$EV_KEYSTORE_PASSWORD"
            echo "EV_KEY_ALIAS=$EV_KEY_ALIAS"
            echo "EV_KEY_PASSWORD=$EV_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: EV-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
